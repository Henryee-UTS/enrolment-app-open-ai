name: Lab 11 Azure OIDC Verification

on:
  push:
    branches:
      - lab11-testing-deployment

permissions:
  id-token: write
  contents: read

jobs:
  verify-oidc:
    name: Verify Azure OIDC Login
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access
        run: |
          az account show --query "{Name:name,State:state}" -o json
          az group show --name lab11-rg --query "{Name:name,Location:location}" -o json
          echo "Azure OIDC verification PASS"
