
name: Lab 11 CI/CD

on:
  push:
    branches:
      - lab11-testing-deployment
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: "Deploy to Azure (may use student credits)"
        type: boolean
        required: true
        default: false

jobs:
  lab11-tests:
    name: Lab 11 Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r enrolment-service/requirements.txt pytest
      - name: Run pre-commit security checks
        run: |
          python -m pip install pre-commit
          python -m pre_commit run --all-files

      - name: Generate temporary JWT secret
        run: |
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET_KEY"
          echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> "$GITHUB_ENV"
          unset JWT_SECRET_KEY

      - name: Build and start Docker services
        run: docker compose up -d --build

      - name: Wait for Enrolment API
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5001/ > /dev/null; then
              echo "Enrolment API is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=50 enrolment-service
          exit 1

      - name: Run post-commit tests and generate evidence
        run: python scripts/lab11/post_commit_evidence.py

      - name: Stop Docker services
        if: always()
        run: docker compose down

      - name: Upload Lab 11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11-test-evidence
          path: |
            reports/lab11/post_commit.log
            reports/lab11/test-results.md
            reports/lab11/test-audit.jsonl
          if-no-files-found: warn

  deploy_azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: lab11-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure == true }}

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: lab11-azure-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up deployment environment
        run: bash scripts/lab11/env-setup.sh

      - name: Build and push Docker images
        run: bash scripts/lab11/build-images.sh

      - name: Refresh Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Container Apps environment
        run: bash scripts/lab11/deploy-azure-env.sh

      - name: Refresh Azure login before deployment
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy microservices
        run: bash scripts/lab11/deploy-azure.sh

      - name: Validate Azure deployment
        run: bash scripts/lab11/deployment-testing.sh

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11-azure-deployment-evidence
          path: reports/lab11/deployment-results.md
          if-no-files-found: warn
